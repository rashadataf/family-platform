name: family-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ${POSTGRES_DB:-family_platform}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-family_platform}']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  # No explicit `name:` override: Compose namespaces this per the top-level
  # `name: family-platform` project name, so it can never collide with an
  # unrelated project's identically-keyed volume on a shared machine.
  postgres_data:
