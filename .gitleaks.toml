# Secret-scanning configuration.
#
# This is the SECOND layer. GitHub secret scanning with push protection is
# already enabled on this repository (free, because it is public) and is the
# stronger control: it rejects the push, so a detected credential never enters
# history at all. gitleaks exists because the two fail differently. GitHub
# matches provider-issued token formats it has been taught; it will not flag
# `DATABASE_URL=postgresql://postgres:aRealPassword@host/db`, which is not a
# partner pattern but is exactly the shape of credential this project handles
# (ADR-013 puts VPS and database credentials in play).

[extend]
useDefault = true

[[allowlists]]
description = """
.env.example is the committed template (spec 001 FR-006). Its values are
deliberately fake and its entire purpose is to be copied to .env and edited.

This is a PERMANENT statement about a file whose job is to hold placeholder
values — unlike a vulnerability suppression, it carries no expiry, because
there is no risk here that could later become real. A scanner that fails on
its own repository's fixtures is switched off within a week, and then it
protects nothing (FR-014).
"""
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = """
A throwaway Ed25519 private key (`openssl genpkey -algorithm ed25519`),
generated solely as a test fixture for infrastructure/src/config.spec.ts and
deploy.spec.ts (spec 003), proving `loadStackConfig`'s well-formed-PEM check
accepts a real key and that every command.remote.* resource's connection is
sourced correctly. It has never signed anything and connects to nothing —
but it is still a syntactically valid PEM private key, exactly the shape
gitleaks' own default `private-key` rule exists to catch.

Allowlisted by its exact value, not by path or file: `*.spec.ts` and
`infrastructure/**` stay unallowlisted on purpose, the same reasoning
already applied to the database-connection-string-password rule below — a
real private key pasted into either later must still be caught.
"""
regexTarget = "match"
regexes = [
  '''-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIMKN9gLVY833sHBscKsZE\+SdwV5sJw5yFgnoRgm4VN5l\n-----END PRIVATE KEY-----''',
]

[[allowlists]]
description = """
A second throwaway Ed25519 private key, this one in OpenSSH's own container
format (`ssh-keygen -t ed25519`'s default output, comment
"throwaway-test-key-no-real-host"), added to config.spec.ts to prove
`isWellFormedPrivateKey` accepts the format `ssh-keygen` actually produces by
default — Node's `crypto.createPrivateKey` cannot parse this format at all,
which the PKCS8 PEM fixture above could never exercise. Same discipline as
above: allowlisted by exact value, not by path.
"""
regexTarget = "match"
regexes = [
  '''-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\nQyNTUxOQAAACDqr8NqswYlNe5h\+oMWYGv59j3P\+rREwPejto4iIBu3\+wAAAKhcFBP/XBQT\n/wAAAAtzc2gtZWQyNTUxOQAAACDqr8NqswYlNe5h\+oMWYGv59j3P\+rREwPejto4iIBu3\+w\nAAAECVJy6bhTf5GaCocZGQvDv31IR0\+Zp/F54bnk8V24Y3hOqvw2qzBiU17mH6gxZga/n2\nPc/6tETA96O2jiIgG7f7AAAAH3Rocm93YXdheS10ZXN0LWtleS1uby1yZWFsLWhvc3QBAg\nMEBQY=\n-----END OPENSSH PRIVATE KEY-----''',
]

# ---------------------------------------------------------------------------
# The rule the default set does not have.
#
# research.md §2 justified adding gitleaks with this exact example:
# `DATABASE_URL=postgresql://postgres:aRealPassword@host/db`, "not a partner
# pattern, but exactly the shape of credential this repository handles". That
# turned out to be half right — GitHub does not flag it, and neither did
# gitleaks' default rules. Verified by planting one and getting a clean scan.
#
# Without this rule the second layer's whole justification is unmet, so it is
# written here rather than assumed.
# ---------------------------------------------------------------------------
[[rules]]
id = "database-connection-string-password"
description = "Password embedded in a database or broker connection string"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp)://[^\s:@/]+:([^\s:@/"']{6,})@'''
secretGroup = 1
keywords = ["postgres", "postgresql", "mysql", "mongodb", "redis", "amqp"]

  # The placeholder passwords this repository commits on purpose: .env.example,
  # docker-compose.yml and the CI service containers all use `localdev` against
  # a throwaway local database. Listing them by value keeps the rule usable;
  # allowlisting the files instead would blind it to a real credential landing
  # in one of them later.
  [[rules.allowlists]]
  description = "Known development placeholders, not credentials"
  regexTarget = "match"
  regexes = [
    '''(?i):(localdev|postgres|password|changeme|secret|example|test|arealpassword|realpassword)@''',
    # `arealpassword` / `realpassword`: this feature's own spec.md and research.md
    # illustrated a connection-string leak using an illustrative English phrase
    # rather than a placeholder token, before the prose was corrected to
    # `<password>`. The two commits that introduced it (20d49c4, 633ecf0) are on
    # `main` now, so this is enumerated by value rather than fixed by rewriting
    # published history. It is a specific, known, historical string — not a path
    # exemption for `specs/**`, which stays unallowlisted on purpose so a real
    # credential pasted into a spec later is still caught.
    '''\$\{[^}]+\}@''',
    ''':<[^>]+>@''',
  ]
