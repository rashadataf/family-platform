packages:
  - 'apps/*'
  - 'packages/*'
  # A literal path, not a glob: this is the one package ADR-004/ADR-013
  # place outside apps/* and packages/*, per ARCHITECTURE.md §8.
  - 'infrastructure'

# pnpm 10 blocks postinstall scripts by default. These need them:
# Prisma downloads its query engine binaries, esbuild its platform binary.
# Everything not listed here stays blocked, which is the point (ADR-001).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  # Each downloads its matching Pulumi resource provider plugin binary
  # (`scripts/install-pulumi-plugin.js`) — without it, `pulumi up`/`preview`
  # fails at the first resource of that type with "no resource plugin found".
  - '@pulumi/command'
  - '@pulumi/docker-build'
  # Transitive dependency of @pulumi/pulumi's gRPC layer; its postinstall
  # selects a prebuilt binary for protobuf (de)serialization.
  - 'protobufjs'

# Transitive dependencies forced past a published advisory.
#
# Both are pinned by their parents at versions with known HIGH advisories, and
# in both cases the newest upstream release still pins the vulnerable version
# (@nestjs/platform-express@12 still requires multer 2.2.0; @prisma/config
# still requires deepmerge-ts 7.1.5), so waiting for a parent bump is not a
# plan. Forcing the fixed version here is preferable to an osv-scanner
# suppression: a suppression accepts the risk, an override removes it.
#
# Each entry should be deleted once the parent has caught up.
overrides:
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf, GHSA-wc9g-mqfw-jrwm (HIGH)
  multer: '^2.3.0'
  # GHSA-ggr8-5vv4-36mx (HIGH, CVSS 8.2). A major bump inside Prisma's config
  # loader, so it is proved by running prisma generate, the build and the
  # migrator rather than assumed compatible.
  deepmerge-ts: '^8.0.2'
  # GHSA-w5hq-g745-h8pq (HIGH, CVSS 7.5). Pulled in by `xcode` (spec 007,
  # apps/mobile's Expo tooling) at v7.0.3, a major behind the fix. `xcode`
  # only calls `uuid.v4()` to generate pbxproj entry ids — an API stable
  # since uuid's early majors — so forcing the fixed version needs no proof
  # beyond `pnpm typecheck`/`build` passing, which they do.
  uuid: '^11.1.1'
