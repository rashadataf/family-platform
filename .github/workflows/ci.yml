name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Constitution, Development Workflow and Quality Gates: "Typecheck, strict
  # mode, zero errors". Covers every workspace package AND the root package's
  # own `scripts/**` via the //#typecheck:workspace-root task — that code
  # orchestrates every developer's environment and was previously unchecked.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - run: pnpm exec turbo run typecheck typecheck:workspace-root

  # "Lint, zero warnings" — the `--max-warnings 0` the constitution names
  # lives in each package's own lint script, so it applies locally too.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - run: pnpm exec turbo run lint lint:workspace-root

  # Formatting is not in the constitution's gate table, but `pnpm verify`
  # already ran it locally; a check that only exists on developer machines is
  # not a gate.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  # The UNIT tier only, and it must stay that way: no database, under 30
  # seconds (FR-021, SC-007). The integration tier is `test-integration`.
  #
  # The job NAME is unchanged even though the command behind it is not.
  # Branch protection on `main` names required checks by job name, so renaming
  # this would block every later merge on a check that no longer reports.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: test
      - run: pnpm test

  # Separate from `test` because the constitution's gate table lists unit and
  # integration tests as separate rows, and because folding them together would
  # make the fast tier as slow as the slow one — at which point people stop
  # running it locally, which is the whole value of having a fast tier.
  #
  # The harness derives `<database>_test` from DATABASE_URL and applies the
  # committed migrations to it, so this needs no CI-specific flag: the same
  # `pnpm test:integration` runs here, on the host, and in the dev container
  # (FR-020).
  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: family_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:localdev@127.0.0.1:5432/family_platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: test-integration
      - run: pnpm test:integration

  # Constitution Principle III: "Architecture Boundaries Are Enforced, Not
  # Suggested". The principle names dependency-cruiser explicitly and until now
  # nothing ran it, which left code review — the layer the constitution itself
  # calls "assumed to fail" — as the only one operating.
  #
  # Fail-closed: the rule set is an `allowed` graph with allowedSeverity error,
  # so a dependency matching no entry is a violation. That matters most for the
  # rules governing packages/core, which does not exist yet: a fail-open
  # configuration would let the first bounded context arrive unchecked.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm boundaries

  # Principle II requires .env.example to stay in sync with the API's env
  # schema. The check existed as `pnpm verify:env` but nothing ran it.
  # Also runs the Node version drift check (FR-014). Deliberately a step here
  # rather than a job of its own: branch protection on `main` names required
  # checks by JOB NAME, so renaming or splitting this job would block every
  # later merge on a check that no longer reports.
  verify-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm verify:env
      - run: pnpm verify:node-version
      - run: pnpm verify:action-pins
      - run: pnpm verify:workspace

  # Closes TODO(SECURITY_SCAN_TOOLING), open since the constitution was
  # ratified. Two scanners, because they fail differently.
  #
  # The scanners run as their own pinned container images rather than as
  # wrapper Actions. gitleaks-action v2 is licensed separately from gitleaks
  # itself and requires a key for organization-owned repositories; this
  # repository is a personal account today, so it would work today, and would
  # break the moment the project moves to a company org. FR-032 says no paid
  # or subscription service of any kind, and a dependency that is free only
  # while a condition holds is not the same as one that is free. The tools
  # themselves are MIT and Apache-2.0.
  #
  # Digests are index digests, not platform digests, and are bumped by hand —
  # Dependabot's github-actions ecosystem does not see them. Named here so
  # nobody has to rediscover it.
  security:
    runs-on: ubuntu-latest
    env:
      # gitleaks v8.30.1
      GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      # osv-scanner v2.5.1
      OSV_SCANNER: ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans a commit range, which needs the commits.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # FR-009/FR-010. GitHub push protection is the first layer and is already
      # enabled; it rejects the push, so a credential it recognises never
      # enters history. This catches what its partner-pattern list does not —
      # in particular a password inside a database connection string, which
      # neither GitHub nor gitleaks' own default rules flag, and which
      # .gitleaks.toml adds a rule for.
      #
      # --redact is not optional. This repository is public: a scanner that
      # prints what it found into a build log has moved the secret somewhere
      # more accessible than where it started.
      - name: Scan the proposed change for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
            docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS" \
              git /repo --config /repo/.gitleaks.toml --redact --no-banner \
              --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          else
            # A push to main, where there is no base to diff against. The
            # working tree is what merged, so that is what gets scanned.
            echo "Scanning the working tree"
            docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS" \
              dir /repo --config /repo/.gitleaks.toml --redact --no-banner
          fi

      # FR-013: a suppression that never expires is permanent silence. The tool
      # treats `ignoreUntil` as optional, so this is enforced here instead.
      - run: pnpm verify:suppressions

      # FR-011/FR-012. osv-scanner exits non-zero for anything it finds,
      # including LOW; the HIGH/CRITICAL threshold and the "name the package,
      # the advisory and the fix" output live in the script, which has tests.
      - name: Scan the lockfile for known advisories
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo "$OSV_SCANNER" \
            scan source --lockfile=/repo/pnpm-lock.yaml --config=/repo/osv-scanner.toml \
            --format json > osv-report.json || true
          pnpm exec tsx scripts/filter-advisories.ts osv-report.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - run: pnpm exec turbo run build

  # Builds the deployable and proves it actually runs (spec 004, US2).
  #
  # Build-only would catch Dockerfile syntax and missing files, and none of the
  # three failure modes that matter: an incomplete production dependency prune,
  # a Prisma client that resolves locally but not in the pruned tree, and an
  # image that starts but cannot reach a database. So this job starts the image
  # against a real Postgres and requires /health/ready to succeed.
  #
  # Nothing is pushed. Whether a registry exists is spec 003's open question.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: family_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # linux/amd64 is what the VPS runs, and ubuntu-latest is natively amd64,
      # so no QEMU emulation is involved (research.md §8).
      - name: Build runtime target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: fp-api:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build migrator target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          platforms: linux/amd64
          load: true
          tags: fp-api:migrator
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      # FR-008 / SC-006: assert by inspection, not by assertion in a document.
      - name: Assert the runtime image carries nothing it should not
        run: |
          set -euo pipefail
          fail=0
          for tool in pnpm npm npx corepack yarn prisma tsc; do
            if docker run --rm --entrypoint sh fp-api:runtime -c "command -v $tool" >/dev/null 2>&1; then
              echo "::error::runtime image contains '$tool' (FR-008: no package manager, no dev dependencies)"
              fail=1
            fi
          done
          if docker run --rm --entrypoint sh fp-api:runtime -c 'ls -d src' >/dev/null 2>&1; then
            echo "::error::runtime image contains application source (FR-008)"
            fail=1
          fi
          user=$(docker run --rm --entrypoint sh fp-api:runtime -c 'whoami')
          if [ "$user" != "node" ]; then
            echo "::error::runtime image runs as '$user', expected non-root 'node' (FR-008)"
            fail=1
          fi
          exit $fail

      - name: Apply migrations with the migrator image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://postgres:localdev@127.0.0.1:5432/family_platform' \
            fp-api:migrator

      # The step that catches an incomplete prune (FR-016).
      - name: Start the runtime image and require /health/ready
        run: |
          set -euo pipefail
          docker run -d --name api --network host --init \
            -e NODE_ENV=production -e PORT=3000 -e LOG_LEVEL=info \
            -e POSTGRES_PORT=5432 -e POSTGRES_DB=family_platform \
            -e DATABASE_URL='postgresql://postgres:localdev@127.0.0.1:5432/family_platform' \
            fp-api:runtime
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/health/ready >/dev/null 2>&1; then
              echo "runtime image reached /health/ready"
              curl -fsS http://127.0.0.1:3000/health/ready; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::runtime image never reported ready — the production dependency tree is probably incomplete"
          docker logs api
          exit 1

      - name: Require a graceful stop (FR-009)
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker stop api >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stop took ${elapsed}s"
          if [ "$elapsed" -ge 9 ]; then
            echo "::error::SIGTERM was ignored — Docker fell back to SIGKILL after its timeout"
            exit 1
          fi
          docker logs api 2>&1 | grep -q "Database connections released" \
            || { echo "::error::shutdown hook did not run"; docker logs api; exit 1; }

      # FR-016. osv-scanner reads the lockfile and therefore sees application
      # dependencies only. It cannot see the Debian packages in the base layer,
      # which are on a completely different update cadence and are what ADR-013
      # ships to a VPS. A step in this job rather than a job of its own,
      # because the artifact is already built here.
      #
      # --ignore-unfixed is deliberate. A base-image CVE with no released fix
      # cannot be actioned by anyone here, and a gate that is permanently red
      # for reasons nobody can address is one that gets switched off — which
      # would cost more than the findings it reports. Fixable HIGH and CRITICAL
      # findings block; the rest are surfaced by the scheduled audit.
      - name: Scan the runtime image for OS and library CVEs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --scanners vuln fp-api:runtime

  # Constitution, Development Workflow and Quality Gates: "Infrastructure
  # validation and preview" (spec 003). `pulumi preview` never mutates the
  # shared vps-staging stack — safe to run from any pull request branch
  # (contracts/cli-and-config.md). `if:` is required, not decoration: this
  # job's only documented trigger is pull_request, and without the guard it
  # would also run — pointlessly, and against a stack a push event has no
  # business previewing — on every push to main.
  infra-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # No `command:`/`work-dir:` input: this action's job here is only to put
      # a `pulumi` binary on PATH, matching contracts/cli-and-config.md's
      # command table exactly rather than introducing a second, competing way
      # to invoke it (the action's own `command` input) alongside the `pnpm`
      # scripts already documented as the real interface.
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      - run: pnpm staging:preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # FR-019: merging to main deploys automatically, only after every existing
  # blocking check has already passed on the merged commit.
  #
  # `needs:` names the full current ten-job blocking set — corrected here
  # from spec 002's original four (contracts/cli-and-config.md's "Corrected
  # before implementation" note). `needs:` alone does not stop this job from
  # also running on a pull_request: every job it names here also runs on
  # pull_request, so without the `if:` guard this would deploy an unmerged
  # branch to the shared staging environment the moment its checks went
  # green — before review, before merge. `if:` and `needs:` are both load
  # -bearing here, not redundant.
  #
  # This list must be kept current — see this job's entry in
  # contracts/cli-and-config.md and the follow-up issue tracked there.
  infra-deploy:
    if: github.event_name == 'push'
    needs:
      [
        typecheck,
        lint,
        format,
        test,
        test-integration,
        verify-env,
        boundaries,
        security,
        build,
        image,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      - run: pnpm staging:deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
