name: Secret audit

# FR-015. The `security` job in ci.yml is the GATE: it scans what a pull
# request proposes to add, and it blocks. This is the AUDIT: the full history,
# on a schedule, blocking nothing.
#
# The split is not fastidiousness. Blocking every merge on a secret that is
# already in this repository's history would be theatre — the repository is
# public, so anything ever committed was harvested by scrapers within seconds
# of the push, and rotation is the only remedy that means anything. Making
# every future merge wait for that would punish people who did not do it while
# achieving nothing for the credential. New introductions block; what is
# already published gets triaged and rotated.

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour on purpose: scheduled workflows queue
    # heavily on the hour and can be delayed or dropped.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-audit
  cancel-in-progress: false

jobs:
  # Deliberately NOT named `security`, and never added to branch protection.
  # A required check that only reports weekly would block every merge for the
  # six days it has not run.
  full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the entire history for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-history.json

      # `if: always()` so the report is available precisely when the scan
      # failed, which is the only time anyone wants it. Redacted, because the
      # artifact is downloadable by anyone who can read this public repository.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-history
          path: gitleaks-history.json
          if-no-files-found: ignore
          retention-days: 30
